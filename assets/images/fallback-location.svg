<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="contourGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad)" />

  <!-- Grid Lines -->
  <line x1="0" y1="100" x2="800" y2="100" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 8" />
  <line x1="0" y1="200" x2="800" y2="200" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 8" />
  <line x1="0" y1="300" x2="800" y2="300" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 8" />
  <line x1="0" y1="400" x2="800" y2="400" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 8" />
  <line x1="200" y1="0" x2="200" y2="500" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 8" />
  <line x1="400" y1="0" x2="400" y2="500" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 8" />
  <line x1="600" y1="0" x2="600" y2="500" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 8" />

  <!-- Radar Terrain Topographic Elevation Contours -->
  <path d="M-50 420 Q120 360 250 400 T550 370 T850 410 L850 500 L-50 500 Z" fill="#0f2648" opacity="0.6" />
  <path d="M-50 420 Q120 360 250 400 T550 370 T850 410" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.5" />

  <path d="M-50 350 Q160 280 320 330 T640 290 T850 330 L850 500 L-50 500 Z" fill="#082f49" opacity="0.4" />
  <path d="M-50 350 Q160 280 320 330 T640 290 T850 330" stroke="#00f0ff" stroke-width="2" fill="none" opacity="0.7" />

  <path d="M-50 280 Q190 200 400 240 T700 180 T850 220" stroke="url(#contourGrad)" stroke-width="2.5" fill="none" />
  <path d="M-50 210 Q240 140 450 170 T780 120 T850 150" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="6 6" fill="none" opacity="0.6" />

  <!-- Target Scanning Overlay -->
  <circle cx="400" cy="240" r="45" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="4 4" />
  <circle cx="400" cy="240" r="18" stroke="#00f0ff" stroke-width="1" />
  <circle cx="400" cy="240" r="4" fill="#00f0ff" />
  <line x1="400" y1="180" x2="400" y2="300" stroke="#00f0ff" stroke-width="1" opacity="0.4" />
  <line x1="340" y1="240" x2="460" y2="240" stroke="#00f0ff" stroke-width="1" opacity="0.4" />

  <!-- Digital Telemetry Labels -->
  <text x="30" y="50" fill="#00f0ff" font-family="'Space Grotesk', monospace" font-size="14" font-weight="bold" letter-spacing="2">TERRESTRIAL ANALOGUE TELEMETRY</text>
  <text x="30" y="74" fill="#64748b" font-family="'Inter', sans-serif" font-size="12">SPECTRAL DIGITAL ELEVATION MODEL (DEM)</text>
  <text x="770" y="50" fill="#38bdf8" font-family="'Space Grotesk', monospace" font-size="12" text-anchor="end">STATUS: READY</text>
  <text x="770" y="74" fill="#64748b" font-family="'Space Grotesk', monospace" font-size="11" text-anchor="end">RESOLUTION: 1.2M/PIXEL</text>
</svg>
