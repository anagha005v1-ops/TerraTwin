  <circle cx="160" cy="235" r="9" fill="#475569" stroke="#94a3b8" stroke-width="1" />

  <!-- Grid overlay -->
  <circle cx="250" cy="250" r="210" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 8" opacity="0.3" />
  <!-- Artemis South Pole Marker -->
  <circle cx="250" cy="425" r="5" fill="#00f0ff" />
  <circle cx="250" cy="425" r="12" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.8" />
