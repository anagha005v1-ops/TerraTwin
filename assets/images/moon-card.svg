  </defs>

  <circle cx="250" cy="250" r="230" fill="url(#spaceAura)" />
  <circle cx="250" cy="250" r="180" fill="url(#lunarGlow)" />

  <!-- Lunar Maria (Dark Basaltic Plains) -->
  <path d="M160 170 C190 140 240 150 270 180 C290 200 270 230 230 220 C190 210 160 200 160 170 Z" fill="#334155" opacity="0.65" />
  <path d="M260 220 C300 200 350 220 370 260 C350 290 310 300 280 280 C250 260 240 230 260 220 Z" fill="#334155" opacity="0.6" />
  <path d="M180 270 C220 260 240 290 230 330 C200 360 160 340 150 310 C140 280 160 270 180 270 Z" fill="#334155" opacity="0.55" />

  <!-- Prominent Impact Craters -->
  <!-- Tycho & Ray system -->
  <circle cx="250" cy="380" r="16" fill="#475569" stroke="#e2e8f0" stroke-width="2" />
  <circle cx="250" cy="380" r="6" fill="#f8fafc" />
  <!-- Rays -->
  <line x1="250" y1="364" x2="210" y2="280" stroke="#f1f5f9" stroke-width="1" opacity="0.4" stroke-dasharray="3 3" />
  <line x1="250" y1="364" x2="290" y2="290" stroke="#f1f5f9" stroke-width="1" opacity="0.4" stroke-dasharray="3 3" />
  <line x1="250" y1="396" x2="270" y2="420" stroke="#f1f5f9" stroke-width="1" opacity="0.4" stroke-dasharray="3 3" />

  <!-- Copernicus Crater -->
  <circle cx="210" cy="240" r="12" fill="#475569" stroke="#94a3b8" stroke-width="1.5" />
  <circle cx="210" cy="240" r="4" fill="#e2e8f0" />

