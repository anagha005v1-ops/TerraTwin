<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="earthGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="marsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Orbital ring -->
  <ellipse cx="50" cy="50" rx="42" ry="18" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4" transform="rotate(-28 50 50)" opacity="0.6" />
  
  <!-- Outer Glow Circle -->
  <circle cx="44" cy="50" r="26" fill="url(#earthGrad)" opacity="0.25" filter="url(#glow)" />
  
  <!-- Earth Sphere (Twin 1) -->
  <circle cx="44" cy="50" r="24" fill="url(#earthGrad)" />
  <!-- Earth Landmass stylization -->
  <path d="M36 36 C42 34 46 40 50 42 C54 44 58 41 62 45 C58 52 50 54 46 60 C42 66 38 64 34 58 C30 52 32 42 36 36 Z" fill="#0c4a6e" opacity="0.5" />
  
  <!-- Moon / Mars Orbiting Twin (Crescent Intersecting) -->
  <circle cx="62" cy="40" r="15" fill="url(#marsGrad)" opacity="0.9" />
  <path d="M54 30 C58 35 62 44 59 52 C53 47 50 40 54 30 Z" fill="#7f1d1d" opacity="0.4" />
  
  <!-- Lunar satellite beacon -->
  <circle cx="28" cy="32" r="4.5" fill="url(#moonGrad)" filter="url(#glow)" />
  <circle cx="28" cy="32" r="2" fill="#0f172a" />
  
  <!-- Trajectory Crosshairs -->
  <line x1="44" y1="20" x2="44" y2="24" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" />
  <line x1="44" y1="76" x2="44" y2="80" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" />
  <line x1="14" y1="50" x2="18" y2="50" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" />
  <line x1="70" y1="50" x2="74" y2="50" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" />
</svg>
