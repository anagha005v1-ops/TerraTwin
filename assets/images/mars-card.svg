<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <defs>
    <radialGradient id="martianGlow" cx="42%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#fdba74" />
      <stop offset="30%" stop-color="#f97316" />
      <stop offset="65%" stop-color="#c2410c" />
      <stop offset="100%" stop-color="#431407" />
    </radialGradient>
    <radialGradient id="marsAtmosphere" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>
  </defs>

  <circle cx="250" cy="250" r="230" fill="url(#marsAtmosphere)" />
  <circle cx="250" cy="250" r="180" fill="url(#martianGlow)" />

  <!-- North Polar Cap (Water/CO2 ice) -->
  <path d="M220 74 C240 70 260 70 280 74 C270 90 230 90 220 74 Z" fill="#ffffff" opacity="0.9" />

  <!-- Dark Albedo features (Syrtis Major, Sinus Sabaeus) -->
  <path d="M180 180 C210 160 250 170 270 200 C280 230 260 260 230 250 C190 240 170 210 180 180 Z" fill="#7c2d12" opacity="0.75" />
  <path d="M250 250 C310 240 370 260 380 300 C360 330 300 320 260 300 C240 280 240 260 250 250 Z" fill="#7c2d12" opacity="0.7" />

  <!-- Valles Marineris Canyon System -->
  <path d="M190 290 Q250 310 320 295 Q250 316 190 290 Z" fill="#290e05" stroke="#451a03" stroke-width="2" />
  
  <!-- Olympus Mons Shield Volcano -->
  <circle cx="160" cy="220" r="16" fill="#9a3412" stroke="#ea580c" stroke-width="1.5" />
  <circle cx="160" cy="220" r="5" fill="#431407" />

  <!-- Orbiting grid -->
  <circle cx="250" cy="250" r="215" stroke="#f97316" stroke-width="1" stroke-dasharray="6 8" opacity="0.35" />

  <!-- Jezero Crater Exploration Target -->
  <circle cx="285" cy="215" r="4.5" fill="#00f0ff" />
  <circle cx="285" cy="215" r="11" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.8" />
  <text x="302" y="218" fill="#00f0ff" font-family="'Space Grotesk', monospace" font-size="11" letter-spacing="1">JEZERO CRATER // PERSEVERANCE</text>
</svg>
